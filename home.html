<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
</head>

<body>



    <!-- navbar  -->

    <div class="navbar bg-base-100 shadow-sm w-11/12 mx-auto">
        <div class="flex flex-1 items-center">
            <img class="w-6 h-7" src="./assets/github-logo.png" alt="">
            <a class="btn btn-ghost text-xl">GitHub Issues Tracker</a>
        </div>
        <div class="flex gap-2">
            <input id="searchText" type="text" placeholder="Search issues" class="input input-bordered w-24 md:w-auto" />
            <div class="dropdown dropdown-end">
                <button onclick="searchIssue()" class="btn w-full py-2 text-white rounded bg-indigo-700"><i
                        class="fa-solid fa-plus"></i>
                    New Issue
                </button>
            </div>
        </div>
    </div>


    <section class="mt-15 w-11/12 mx-auto">

        <!-- Tab sections  -->
        <div class="flex gap-3">
            <button id="allTab" class="tab w-35 py-2 text-white font-bold rounded bg-indigo-700">All</button>
            <button id="openTab" class="tab font-bold rounded w-35">Open</button>
            <button id="closedTab" class="tab font-bold rounded w-35">Closed</button>
        </div>

        <!-- card headline  -->
        <div class="mt-7 flex justify-between">
            <div class="flex items-center gap-3">
                <img class="w-8 h-8" src="./assets/Aperture.png" alt="">
                <div>
                    <p class="font-bold">50 Issues</p>
                    <p class="text-gray-500">Track and manage your project issues</p>
                </div>

            </div>
            <div class="flex gap-3">
                <div class="flex items-center justify-center gap-1">
                    <div class="border border-none rounded-[50%] w-2 h-2 bg-green-500"></div>
                    <p>Open</p>
                </div>
                <div class="flex items-center justify-center gap-1">
                    <div class="border border-none rounded-[50%] w-2 h-2 bg-purple-500"></div>
                    <p>Closed</p>
                </div>

            </div>
        </div>

        <!-- card sections  -->
        <div id="issue-container" class="grid grid-cols-1 place-items-center md:grid-cols-2 lg:grid-cols-4 gap-4 mt-10 mb-5">

        </div>

    </section>

    <!-- spinner  -->
    <div id="spinner" class="hidden">
        <h1 class="text-center text-9xl animate-spin"><i class="fa-solid fa-spinner"></i></h1>
    </div>

   
    <script src="./script/script.js"></script>
</body>

</html>
